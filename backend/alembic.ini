[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Database URL is set at runtime by alembic/env.py from settings.DATABASE_URL
# (see app/config.py / the .env file). The value below is only a non-secret
# placeholder for tooling that inspects this file directly; env.py always
# overrides it via config.set_main_option("sqlalchemy.url", ...).
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/invoicesaas

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
